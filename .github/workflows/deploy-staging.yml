name: Deploy to Staging

# Runs only after a push lands on main (i.e. after a PR merge), and only once CI has a
# chance to run on that same commit via the workflow_run trigger below — this keeps
# "tests passed" and "deploy happened" as two separate, auditable facts.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "repo_lower=$REPO_LOWER" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:staging-latest

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deploy for ghcr.i
o/${{ github.repository }}:${{ needs.build-and-push.outputs.image_tag }}"
          curl -f "$RENDER_DEPLOY_HOOK_URL"
      - name: Wait for deploy to roll out
        run: sleep 45

      - name: Smoke test staging health endpoint
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          curl -f "$STAGING_URL/v1/health"

  # NOTE: Production is intentionally NOT deployed automatically here.
  # Promotion to production is a deliberate manual step (docs/architecture.md §4,
  # docs/phases.md Phase 4) — re-tag the exact staging image that was smoke-tested and
  # promote it, rather than rebuilding, so staging and production run byte-identical images.